<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика - Платформа тестирования</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 🎨 Квадратики на фоне -->
    <div id="background-squares"></div>

    <div id="app">
        <!-- Страница входа -->
        <div id="authPage" class="container">
            <div class="auth-box">
                <h1>🔬 Физика</h1>
                <h2>Платформа для тестирования</h2>
                <div id="authForm">
                    <div class="form-group">
                        <input type="text" id="username" placeholder="Имя пользователя" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" placeholder="Пароль" required>
                    </div>
                    <div id="authError" class="error-message"></div>
                    <button id="loginBtn" class="btn-primary">Войти</button>
                    <button id="registerBtn" class="btn-secondary">Зарегистрироваться</button>
                </div>
                <div class="auth-footer">
                    <small>Демо: admin / admin123 или user / user123</small>
                </div>
            </div>
        </div>

        <!-- Главная страница -->
        <div id="mainPage" class="container" style="display: none;">
            <header>
                <div class="header-content">
                    <h1>🔬 Платформа тестирования</h1>
                    <div class="user-info">
                        <span id="currentUser"></span>
                        <span id="userRole" class="role-tag"></span>
                        <button id="logoutBtn" class="btn-small">Выйти</button>
                    </div>
                </div>
                <!-- Навигация для админа -->
                <div id="adminNav" style="display: none;" class="admin-tabs">
                    <button class="tab-btn active" data-tab="tests">📝 Тесты</button>
                    <button class="tab-btn" data-tab="create">➕ Создать тест</button>
                    <button class="tab-btn" data-tab="stats">📊 Статистика</button>
                    <button class="tab-btn" data-tab="myresults">📈 Мои результаты</button>
                    <button class="tab-btn" data-tab="leaderboard">🏆 Лидеры</button>
                </div>
                <!-- Навигация для пользователя -->
                <div id="userNav" style="display: none;" class="admin-tabs">
                    <button class="tab-btn active" data-tab="tests">📝 Доступные тесты</button>
                    <button class="tab-btn" data-tab="myresults">📈 Мои результаты</button>
                    <button class="tab-btn" data-tab="leaderboard">🏆 Лидеры</button>
                </div>
            </header>

            <!-- Вкладка: Список тестов -->
            <div id="tab-tests" class="tab-content active">
                <div id="testsList"></div>
            </div>

            <!-- Вкладка: Создание теста (только админ) -->
            <div id="tab-create" class="tab-content">
                <h2>Создать новый тест</h2>
                <form id="createTestForm">
                    <div class="form-group">
                        <label>Название теста</label>
                        <input type="text" id="testTitle" placeholder="Введите название" required>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="testDescription" placeholder="Краткое описание"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Класс</label>
                        <input type="text" id="testClass" placeholder="7-8" value="7-8">
                    </div>
                    <div id="questionsEditor">
                        <h3>Вопросы</h3>
                        <div id="questionsList"></div>
                        <button type="button" id="addQuestionBtn" class="btn-secondary">+ Добавить вопрос</button>
                    </div>
                    <button type="submit" class="btn-primary">Создать тест</button>
                </form>
            </div>

            <!-- Вкладка: Статистика (только админ) -->
            <div id="tab-stats" class="tab-content">
                <h2>📊 Статистика платформы</h2>
                <div id="statsContent"></div>
            </div>

            <!-- Вкладка: Мои результаты -->
            <div id="tab-myresults" class="tab-content">
                <h2>📈 Мои результаты</h2>
                <div id="myResultsContent"></div>
            </div>

            <!-- Вкладка: Таблица лидеров -->
            <div id="tab-leaderboard" class="tab-content">
                <h2>🏆 Таблица лидеров</h2>
                <div id="leaderboardContent"></div>
            </div>
        </div>

        <!-- Страница прохождения теста -->
        <div id="testPage" class="container" style="display: none;">
            <header>
                <div class="header-content">
                    <button id="backBtn" class="btn-small">← Назад</button>
                    <h1 id="testTitle"></h1>
                    <div></div>
                </div>
                <div class="progress-info">
                    <span id="questionCounter">Вопрос 1 из 5</span>
                </div>
            </header>

            <div id="questionContainer">
                <!-- Вопросы -->
            </div>

            <div class="navigation">
                <button id="prevBtn" class="btn-nav" disabled>← Назад</button>
                <button id="nextBtn" class="btn-nav">Далее →</button>
                <button id="submitBtn" class="btn-primary" style="display: none;">Завершить тест</button>
            </div>
        </div>

        <!-- Страница результатов -->
        <div id="resultsPage" class="container" style="display: none;">
            <div class="results-box">
                <h1>📊 Результаты</h1>
                <button id="backToTestsBtn" class="btn-small" style="margin-bottom: 20px;">← К списку тестов</button>
                <div id="resultsContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
