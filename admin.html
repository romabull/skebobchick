<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель - Физика</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="app">
        <div id="adminPanel" class="container" style="display: none;">
            <header>
                <div class="header-content">
                    <h1>⚙️ Панель администратора</h1>
                    <div class="user-info">
                        <span id="adminUser"></span>
                        <button id="logoutBtn" class="btn-small">Выйти</button>
                    </div>
                </div>
                <div class="admin-tabs">
                    <button class="tab-btn active" data-tab="tests">📝 Тесты</button>
                    <button class="tab-btn" data-tab="create">➕ Создать тест</button>
                    <button class="tab-btn" data-tab="stats">📊 Статистика</button>
                    <button class="tab-btn" data-tab="calls">📞 Звонки</button>
                </div>
            </header>

            <div id="tab-tests" class="tab-content active">
                <div id="testsList"></div>
            </div>

            <div id="tab-create" class="tab-content">
                <h2>Создать новый тест</h2>
                <form id="createTestForm">
                    <div class="form-group">
                        <label>Название теста</label>
                        <input type="text" id="testTitle" placeholder="Введите название" required>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="testDescription" placeholder="Краткое описание"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Класс</label>
                        <input type="text" id="testClass" placeholder="7-8" value="7-8">
                    </div>
                    <div class="form-group">
                        <label>📚 Категория</label>
                        <select id="testCategory" style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px;">
                            <option value="Механика">Механика</option>
                            <option value="Термодинамика">Термодинамика</option>
                            <option value="Электричество">Электричество</option>
                            <option value="Оптика">Оптика</option>
                            <option value="Квантовая физика">Квантовая физика</option>
                            <option value="Астрономия">Астрономия</option>
                            <option value="Другое" selected>Другое</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>⏱️ Ограничение времени (минут, 0 = без ограничения)</label>
                        <input type="number" id="testTimeLimit" min="0" max="180" value="0">
                    </div>
                    <div id="questionsEditor">
                        <h3>Вопросы</h3>
                        <div id="questionsList"></div>
                        <button type="button" id="addQuestionBtn" class="btn-secondary">+ Добавить вопрос</button>
                    </div>
                    <button type="submit" class="btn-primary">Создать тест</button>
                </form>
            </div>

            <div id="tab-stats" class="tab-content">
                <h2>📊 Статистика платформы</h2>
                <div id="statsContent"></div>
            </div>

            <div id="tab-calls" class="tab-content">
                <h2>📞 Аудиозвонки и демонстрация экрана</h2>
                
                <div id="callsListView">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h3 style="margin: 0; color: #2d3748;">Доступные комнаты</h3>
                        <button id="createRoomBtn" class="btn-primary">+ Создать комнату</button>
                    </div>
                    <div id="roomsContainer"></div>
                </div>

                <!-- Комната (полноэкранная) -->
                <div id="callRoomView" style="display: none;">
                    <div class="call-header">
                        <div class="call-header-info">
                            <h3 id="callRoomName">📞 Комната</h3>
                            <small id="callRoomStatus">Ожидание собеседника...</small>
                        </div>
                        <div class="call-header-actions">
                            <button id="leaveRoomBtn" class="btn-small btn-danger">📵 Выйти</button>
                        </div>
                    </div>

                    <div class="call-stage">
                        <div id="callWaiting" class="call-waiting">
                            <div class="call-waiting-avatar">🎤</div>
                            <div class="call-waiting-text">Ожидание собеседника...</div>
                            <div class="call-waiting-sub">Отправьте ссылку другу, чтобы он присоединился</div>
                        </div>

                        <div id="screenShareContainer">
                            <div id="screenShareInfo"></div>
                            <video id="screenShareVideo" autoplay playsinline muted></video>
                        </div>

                        <div class="call-participants">
                            <h4>👥 Участники</h4>
                            <div id="participantsList"></div>
                        </div>
                    </div>

                    <div class="call-controls">
                        <button id="toggleMicBtn" class="call-btn active" data-label="Микрофон" disabled>🎤</button>
                        <button id="testMicBtn" class="call-btn" data-label="Проверить">🎧</button>
                        <button id="shareScreenBtn" class="call-btn primary" data-label="Экран">🖥️</button>
                        <button id="leaveRoomBtnMobile" class="call-btn danger" data-label="Выйти">📵</button>
                    </div>

                    <div id="remoteAudios"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
